# Builds the GitHub Pages site:
#   /          -> current main (2.x)
#   /legacy/   -> frozen v1.0.0 tag (historical, never modified)
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main      # always publish main, even when the workflow is started by hand from another branch
          path: current

      - name: Checkout legacy v1.0.0
        uses: actions/checkout@v4
        with:
          ref: v1.0.0
          path: legacy

      - name: Assemble site
        run: |
          mkdir -p _site/legacy
          rsync -a --exclude '.git' --exclude '.github' current/ _site/
          rsync -a --exclude '.git' --exclude '.github' legacy/ _site/legacy/

      # offline mode: list every file for the service worker and give this deploy its own cache
      - name: Offline file list
        run: python3 current/.github/scripts/precache.py _site "${GITHUB_SHA::7}"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
